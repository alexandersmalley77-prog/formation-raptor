<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Formation Raptor - Prototype</title>
<style>
html, body { height:100%; overscroll-behavior:none; }
body { margin:0; background:#000; color:#0f0; font-family:monospace; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
canvas { display:block; position:absolute; top:0; left:0; background:#001122; border:2px solid #0f0; box-sizing:border-box; touch-action:none; width:100vw; height:100vh; max-width:100vw; max-height:100vh; object-fit:contain; z-index:1; }
#ui { position:absolute; top:4px; left:4px; color:#0f0; font-size:12px; z-index:100; max-width:50vw; }
#uiPanel { display:none; }
button { margin:2px; padding:6px 10px; background:#003300; color:#0f0; border:1px solid #0f0; cursor:pointer; font-size:13px; touch-action:manipulation; position:relative; z-index:101; }
#landing { position:fixed; top:0; left:0; width:100vw; height:100vh; background:#001122; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#droneGraphic { width:120px; height:70px; position:relative; margin-bottom:20px; }
#droneBody { width:70px; height:28px; background:#0af; position:absolute; top:20px; left:25px; border-radius:6px; border:2px solid #0ff; }
#droneWingL { width:30px; height:10px; background:#0ff; position:absolute; top:10px; left:0; border-radius:3px; }
#droneWingR { width:30px; height:10px; background:#0ff; position:absolute; top:10px; right:0; border-radius:3px; }
#droneProp { width:16px; height:16px; background:#ff0; border-radius:50%; position:absolute; top:2px; left:52px; animation:spin 0.4s linear infinite; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
#landing button { font-size:16px; padding:10px 20px; }
#touchHint { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); color:#0f0; font-size:8px; text-align:center; }
#powerup { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:20; text-align:center; }
#powerup button { display:block; width:220px; margin:10px auto; font-size:18px; }
#upgrades { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:25; text-align:center; min-width:260px; }
#upgrades button { display:block; width:220px; margin:8px auto; font-size:16px; }
#scores { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:30; text-align:center; min-width:260px; }
#scores button { display:block; width:220px; margin:10px auto; font-size:16px; }
#drones { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:10000; text-align:center; min-width:260px; }
#drones button { display:block; width:220px; margin:8px auto; font-size:16px; }
#scoreList { text-align:left; margin:10px 0; font-size:14px; }
#leaderboard { position:absolute; top:50px; left:4px; color:#0f0; font-size:8px; z-index:100; background:rgba(0,20,0,0.6); border:1px solid #0f0; padding:2px; min-width:80px; max-height:70px; overflow-y:auto; display:none; }
#controls { position:absolute; top:40px; right:4px; background:rgba(0,20,0,0.92); border:1px solid #0f0; padding:2px; z-index:15; font-size:8px; max-height:30vh; overflow-y:auto; width:90px; display:none; }
#controls label { display:block; margin:6px 0 2px; }
#controls input[type=range] { width:100%; }
#controls .val { float:right; color:#0f0; }
</style>
</head>
<body>
<div id="landing">
  <div id="droneGraphic">
    <div id="droneProp"></div>
    <div id="droneWingL"></div>
    <div id="droneWingR"></div>
    <div id="droneBody"></div>
  </div>
  <div style="font-size:18px; margin-bottom:15px;">Formation Raptor</div>
  <button id="enterBtn" onclick="enterGame()" style="font-size:18px; padding:12px 24px;">Enter</button>
  <button id="landingStartBtn" style="font-size:18px; padding:12px 24px;">&#9654; Start Run</button>
  <button id="dronesBtn" onclick="window.toggleDrones=toggleDrones; toggleDrones();">Drones</button>
</div>
<div id="ui">
  <button onclick="toggleUI()">☰ Options</button>
  <div id="uiPanel">
  Energy: <span id="energy">10</span> | Coins: <span id="coins">0</span> | Wave: <span id="wave">1</span>
  <br><button id="startBtn" onclick="startRun()">Start Run (1 Energy)</button>
  <br><button onclick="toggleMode()">Mode: <span id="mode">Multi-Group</span></button>
  <button onclick="togglePause()">Pause</button>
  <button onclick="toggleUpgrades()">Upgrades</button>
  <button onclick="document.getElementById('controls').style.display=document.getElementById('controls').style.display==='block'?'none':'block'">Tune</button>
  <button onclick="toggleDrones()">Drones</button>
  <button onclick="showScores()">Scores</button>
  </div>
</div>
<div id="leaderboard">
  <div style="font-size:16px; margin-bottom:6px; border-bottom:1px solid #0f0;">Leaderboard</div>
  <div id="homeScores">No scores yet</div>
</div>
<div id="touchHint">Touch & drag anywhere to move</div>
<div id="controls">
  <strong>Live Adjustments</strong><br>
  <label>Damage <span class="val" id="dmgVal">36</span></label>
  <input type="range" id="dmgSlider" min="10" max="100" value="36" oninput="setDamage(this.value)">
  <label>Fire Rate (ms) <span class="val" id="frVal">110</span></label>
  <input type="range" id="frSlider" min="50" max="300" value="110" oninput="setFireRate(this.value)">
  <label>Player Speed <span class="val" id="spdVal">5</span></label>
  <input type="range" id="spdSlider" min="2" max="12" value="5" oninput="setSpeed(this.value)">
  <label>Player HP <span class="val" id="hpVal">100</span></label>
  <input type="range" id="hpSlider" min="50" max="300" value="100" oninput="setHP(this.value)">
  <label>Enemy HP Scale <span class="val" id="ehpVal">1</span></label>
  <input type="range" id="ehpSlider" min="0.5" max="3" step="0.1" value="1" oninput="setEnemyHP(this.value)">
  <label>Contact Dmg Scale <span class="val" id="cdmgVal">1</span></label>
  <input type="range" id="cdmgSlider" min="0.5" max="3" step="0.1" value="1" oninput="setContactDmg(this.value)">
  <label>Enemy Proj Scale <span class="val" id="epdmgVal">1</span></label>
  <input type="range" id="epdmgSlider" min="0.5" max="3" step="0.1" value="1" oninput="setEnemyProj(this.value)">
  <button onclick="document.getElementById('controls').style.display='none'">Hide</button>
</div>
<div id="powerup">
  <div id="powerupTitle" style="font-size:20px; margin-bottom:10px;">Wave Clear! Pick a Power-Up</div>
  <button id="p1" onclick="pickPower(0)"></button>
  <button id="p2" onclick="pickPower(1)"></button>
  <button id="p3" onclick="pickPower(2)"></button>
</div>
<div id="upgrades">
  <div style="font-size:20px; margin-bottom:10px;">Permanent Upgrades</div>
  <div>Coins: <span id="upgCoins">0</span></div>
  <button id="btnDmg" onclick="buyDamage()">+5 Damage (100 coins)</button>
  <button id="btnFR" onclick="buyFireRate()">+Fire Rate (100 coins)</button>
  <button id="btnSpd" onclick="buySpeed()">+1 Speed (100 coins)</button>
  <button id="btnHP" onclick="buyMaxHP()">+20 Max HP (100 coins)</button>
  <button onclick="toggleUpgrades()">Close</button>
</div>
<div id="scores">
  <div style="font-size:20px; margin-bottom:10px;">Top Scores</div>
  <div id="scoreList"></div>
  <button onclick="document.getElementById('scores').style.display='none'">Close</button>
</div>
<div id="drones">
  <div style="font-size:20px; margin-bottom:10px;">Drone Bay</div>
  <div id="dronePreview" style="width:60px; height:40px; margin:10px auto; border:1px solid #0f0;"></div>
  <div>Level: <span id="droneLevel">1</span> | Color: <span id="droneColorName">Basic</span></div>
  <button onclick="upgradeDrone()">Upgrade Drone (100 coins)</button>
  <div style="margin-top:10px; font-size:12px;">Upgrades change drone color and boost damage.</div>
  <button onclick="toggleDrones()">Close</button>
</div>
<canvas id="game" width="480" height="720"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ===================== Persistent save (one object) =====================
const SAVE_KEY = 'fr_save_v1';
const MAX_ENERGY = 10;
const ENERGY_REGEN_MS = 5 * 60 * 1000; // +1 energy every 5 minutes
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};
  const legacyDrone = parseInt(localStorage.getItem('fr_droneLevel') || '1') || 1; // migrate old key
  return {
    coins: Number.isFinite(s.coins) ? s.coins : 0,
    upg: Object.assign({ dmg: 0, fr: 0, spd: 0, hp: 0 }, s.upg || {}),
    droneLevel: s.droneLevel || legacyDrone,
    energy: Number.isFinite(s.energy) ? s.energy : MAX_ENERGY,
    energyTs: s.energyTs || Date.now()
  };
}
let save = loadSave();
let energy = save.energy, coins = save.coins, droneLevel = save.droneLevel;
function persist() {
  save.coins = coins; save.droneLevel = droneLevel; save.energy = energy;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function tickEnergy() {
  const now = Date.now();
  if (energy >= MAX_ENERGY) { save.energyTs = now; return; }
  const gained = Math.floor((now - save.energyTs) / ENERGY_REGEN_MS);
  if (gained > 0) {
    energy = Math.min(MAX_ENERGY, energy + gained);
    save.energyTs = energy >= MAX_ENERGY ? now : save.energyTs + gained * ENERGY_REGEN_MS;
    persist();
  }
  updateUI();
}
function energyEta() {
  if (energy >= MAX_ENERGY) return '';
  const s = Math.max(0, Math.ceil((ENERGY_REGEN_MS - (Date.now() - save.energyTs)) / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
// Permanent upgrades are applied at run start (never reset)
function baseStats() {
  const u = save.upg;
  return { damage: 36 + u.dmg * 5, fireRate: Math.max(50, 110 - u.fr * 15), speed: 5 + u.spd, maxHp: 100 + u.hp * 20 };
}

// ===================== Run state =====================
let state = 'idle'; // 'idle' | 'running' | 'gameover'
let running = false;
let wave = 1, damage = 36, fireRate = 110, multiShot = 1;
let player = { x: 225, y: 560, w: 30, h: 30, speed: 5, hp: 100, maxHp: 100 };
let bullets = [], enemies = [], enemyBullets = [], particles = [], boss = null, keys = {};
let lastShot = 0;
let touchX = null, touchY = null;
let drag = null; // relative drag anchor { fx, fy, px, py }
const DRAG_SENS = 1.2;
let mode = 'multi';
let drones = [];
let picking = false, paused = false;
let currentOptions = [];
let invuln = 0;
let shieldBubbles = [], healthBubbles = [];
let hasShield = false, shieldTimer = 0;
let enemyHPScale = 1, contactDmgScale = 1, enemyProjScale = 1;
let runScore = 0, runCoins = 0, runStart = 0;
let lastSummary = null;
let banner = null; // { text, t }
let highScores = JSON.parse(localStorage.getItem('fr_scores') || '[]');
const droneColors = ['#0af', '#0ff', '#ff0', '#f80', '#f0f', '#fff'];
const droneNames = ['Basic', 'Enhanced', 'Advanced', 'Elite', 'Master', 'Legend'];
const DRONE_SLOTS = [[-40, -20], [40, -20], [0, -45], [-70, 5], [70, 5], [-25, -60], [25, -60]];
const PLAY = { x: 30, y: Math.round(H * 0.32), w: 420, h: 380 };
const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.3 + Math.random() * 1.2 }));

// Tune panel (dev sliders)
function setDamage(v) { damage = parseInt(v); document.getElementById('dmgVal').textContent = v; }
function setFireRate(v) { fireRate = parseInt(v); document.getElementById('frVal').textContent = v; }
function setSpeed(v) { player.speed = parseInt(v); document.getElementById('spdVal').textContent = v; }
function setHP(v) { player.maxHp = parseInt(v); player.hp = Math.min(player.hp, player.maxHp); document.getElementById('hpVal').textContent = v; }
function setEnemyHP(v) { enemyHPScale = parseFloat(v); document.getElementById('ehpVal').textContent = v; }
function setContactDmg(v) { contactDmgScale = parseFloat(v); document.getElementById('cdmgVal').textContent = v; }
function setEnemyProj(v) { enemyProjScale = parseFloat(v); document.getElementById('epdmgVal').textContent = v; }
function syncTune() {
  [['dmg', damage], ['fr', fireRate], ['spd', player.speed], ['hp', player.maxHp]].forEach(([k, v]) => {
    document.getElementById(k + 'Slider').value = v; document.getElementById(k + 'Val').textContent = v;
  });
}

function addDrone() {
  const slot = DRONE_SLOTS[drones.length % DRONE_SLOTS.length];
  drones.push({ offsetX: slot[0], offsetY: slot[1], lastShot: 0 });
}
const powerups = [
  { name: "+Damage", apply: () => { damage += 15; } },
  { name: "+Fire Rate", apply: () => { fireRate = Math.max(50, fireRate - 20); } },
  { name: "Split Shot", apply: () => { multiShot = Math.max(multiShot, 2); } },
  { name: "+1 Projectile", apply: () => { multiShot++; } },
  { name: "Drone Boost", apply: () => { addDrone(); } },
  { name: "+Speed", apply: () => { player.speed += 1; } },
  { name: "+30 Max HP & Heal", apply: () => { player.maxHp += 30; player.hp = player.maxHp; } }
];

// ===================== Menus / UI =====================
function toggleDrones() {
  const el = document.getElementById('drones');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  if (!open) updateDroneUI();
}
function droneCost() { return 100 + (droneLevel - 1) * 50; }
function updateDroneUI() {
  const i = Math.min(droneLevel - 1, droneColors.length - 1);
  document.getElementById('droneLevel').textContent = droneLevel;
  document.getElementById('droneColorName').textContent = droneNames[i];
  document.getElementById('dronePreview').style.background = droneColors[i];
  document.querySelector('#drones button').textContent = droneLevel >= droneColors.length ? 'Drone MAXED' : 'Upgrade Drone (' + droneCost() + ' coins, have ' + coins + ')';
}
function upgradeDrone() {
  const cost = droneCost();
  if (coins >= cost && droneLevel < droneColors.length) {
    coins -= cost; droneLevel++; persist(); updateUI(); updateDroneUI();
  }
}

function enterGame() {
  const landing = document.getElementById('landing');
  if (landing) { landing.style.display = 'none'; landing.style.visibility = 'hidden'; }
  const panel = document.getElementById('uiPanel');
  if (panel) panel.style.display = 'block';
  const lb = document.getElementById('leaderboard');
  if (lb) lb.style.display = 'block';
  document.getElementById('ui').style.zIndex = '1000';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('landing').style.display !== 'none') enterGame();
});
function toggleUI() {
  const panel = document.getElementById('uiPanel');
  const lb = document.getElementById('leaderboard');
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  if (lb) lb.style.display = open ? 'none' : 'block';
}
function collapseOptions() {
  document.getElementById('uiPanel').style.display = 'none';
  const lb = document.getElementById('leaderboard'); if (lb) lb.style.display = 'none';
  document.getElementById('controls').style.display = 'none';
}
function updateUI() {
  document.getElementById('energy').textContent = energy + '/' + MAX_ENERGY + (energy < MAX_ENERGY ? ' (+1 in ' + energyEta() + ')' : '');
  document.getElementById('coins').textContent = coins;
  document.getElementById('wave').textContent = wave;
  document.getElementById('mode').textContent = mode === 'multi' ? 'Multi-Group' : 'Single Durable';
  const sb = document.getElementById('startBtn');
  if (sb) sb.textContent = running ? 'Run in progress' : (energy > 0 ? 'Start Run (1 Energy)' : 'Energy in ' + energyEta());
}
function toggleMode() { mode = mode === 'multi' ? 'single' : 'multi'; updateUI(); }
function togglePause() {
  if (state !== 'running' || picking) return;
  paused = !paused;
  if (paused) persist();
}
function updateHomeScores() {
  const el = document.getElementById('homeScores');
  if (!el) return;
  el.innerHTML = highScores.length ? highScores.map((s, i) => (i + 1) + '. Wave ' + s.wave + ' — ' + s.score).join('<br>') : 'No scores yet';
}
function showScores() {
  const list = document.getElementById('scoreList');
  list.innerHTML = highScores.length ? highScores.map((s, i) => (i + 1) + '. Wave ' + s.wave + ' — ' + s.score + ' pts').join('<br>') : 'No scores yet';
  document.getElementById('scores').style.display = 'block';
}
function saveScore() {
  highScores.push({ wave: wave, score: runScore, date: new Date().toLocaleDateString() });
  highScores.sort((a, b) => b.score - a.score);
  highScores = highScores.slice(0, 10);
  localStorage.setItem('fr_scores', JSON.stringify(highScores));
  updateHomeScores();
}

// Permanent upgrades (persisted in save.upg)
const UPGRADES = {
  dmg: { base: 100, step: 50, max: 20, label: n => '+5 Damage', apply: () => { damage += 5; } },
  fr:  { base: 100, step: 60, max: 4,  label: n => '+Fire Rate', apply: () => { fireRate = Math.max(50, fireRate - 15); } },
  spd: { base: 100, step: 50, max: 5,  label: n => '+1 Speed', apply: () => { player.speed += 1; } },
  hp:  { base: 100, step: 70, max: 10, label: n => '+20 Max HP', apply: () => { player.maxHp += 20; player.hp += 20; } }
};
const UPG_BTN = { dmg: 'btnDmg', fr: 'btnFR', spd: 'btnSpd', hp: 'btnHP' };
function upgCost(k) { return UPGRADES[k].base + save.upg[k] * UPGRADES[k].step; }
function buyUpgrade(k) {
  const u = UPGRADES[k], cost = upgCost(k);
  if (save.upg[k] >= u.max || coins < cost) return;
  coins -= cost; save.upg[k]++;
  if (running) u.apply(); // also takes effect in the current run
  persist(); updateUI(); updateUpgradeButtons();
}
function buyDamage() { buyUpgrade('dmg'); }
function buyFireRate() { buyUpgrade('fr'); }
function buySpeed() { buyUpgrade('spd'); }
function buyMaxHP() { buyUpgrade('hp'); }
function updateUpgradeButtons() {
  document.getElementById('upgCoins').textContent = coins;
  Object.keys(UPGRADES).forEach(k => {
    const u = UPGRADES[k], n = save.upg[k];
    document.getElementById(UPG_BTN[k]).textContent = u.label(n) + ' [' + n + '/' + u.max + '] ' + (n >= u.max ? 'MAX' : '(' + upgCost(k) + ' coins)');
  });
}
function toggleUpgrades() {
  const el = document.getElementById('upgrades');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  updateUpgradeButtons();
  if (!open && running) paused = true;
  if (open) paused = false;
}

// ===================== Run flow =====================
function startFromLanding() { enterGame(); startRun(); }
function startRun() {
  if (running) return;
  tickEnergy();
  if (energy <= 0) { banner = { text: 'No energy — +1 in ' + energyEta(), t: 150 }; return; }
  if (energy >= MAX_ENERGY) save.energyTs = Date.now();
  energy--;
  collapseOptions();
  state = 'running'; running = true; picking = false; paused = false;
  enemies = []; bullets = []; enemyBullets = []; particles = [];
  shieldBubbles = []; healthBubbles = []; boss = null;
  hasShield = false; invuln = 0;
  wave = 1; runScore = 0; runCoins = 0; runStart = performance.now();
  const st = baseStats();
  damage = st.damage; fireRate = st.fireRate; player.speed = st.speed;
  player.maxHp = st.maxHp; player.hp = st.maxHp; multiShot = 1;
  player.x = W / 2 - player.w / 2; player.y = PLAY.y + PLAY.h - 60;
  drones = []; addDrone(); addDrone();
  document.getElementById('powerup').style.display = 'none';
  syncTune();
  spawnWave();
  persist(); updateUI();
}
function endRun() {
  player.hp = 0;
  running = false; state = 'gameover'; paused = false; drag = null;
  saveScore(); persist();
  lastSummary = { score: runScore, wave: wave, coins: runCoins, best: highScores.length ? highScores[0].score : runScore,
                  time: Math.round((performance.now() - runStart) / 1000) };
  updateUI();
}
function backToMenu() {
  state = 'idle'; running = false;
  document.getElementById('uiPanel').style.display = 'block';
  const lb = document.getElementById('leaderboard'); if (lb) lb.style.display = 'block';
  updateUI();
}

function showPowerups(title) {
  picking = true;
  currentOptions = [];
  const pool = [...powerups];
  for (let i = 0; i < 3; i++) currentOptions.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  document.getElementById('powerupTitle').textContent = title || 'Wave Clear! Pick a Power-Up';
  ['p1', 'p2', 'p3'].forEach((id, i) => document.getElementById(id).textContent = currentOptions[i].name);
  document.getElementById('powerup').style.display = 'block';
  persist();
}
function pickPower(i) {
  if (!picking) return;
  currentOptions[i].apply();
  picking = false;
  document.getElementById('powerup').style.display = 'none';
  wave++;
  spawnWave();
  updateUI();
}

// ===================== Waves =====================
function isMiniBossWave(w) { return w % 10 === 5; }
function isBigBossWave(w) { return w % 10 === 0; }
function waveEnemyCount(w) { return Math.min(60, Math.round(12 + (w - 1) * 2.6)); } // 12 at w1, ~35 at w10
function pickType(w) {
  const r = Math.random();
  if (w >= 4 && r < 0.10) return 'tank';
  if (w >= 2 && r < 0.28) return 'shooter';
  if (r < 0.45) return 'charger';
  return 'normal';
}
function makeEnemy(x, y, type, hpBase) {
  const big = type === 'tank';
  return { x, y, w: big ? 30 : 22, h: big ? 30 : 22, vx: 0, vy: 0.9, hp: big ? hpBase * 2.5 : hpBase, diving: false, type };
}
const PATTERNS = [
  (n, y0, hp) => { const x = 120 + Math.random() * 220; for (let i = 0; i < n; i++) enemies.push(makeEnemy(x, y0 - i * 26, pickType(wave), hp)); },
  (n, y0, hp) => { for (let i = 0; i < n; i++) enemies.push(makeEnemy(i % 2 ? 400 : 60, y0 - Math.floor(i / 2) * 26, pickType(wave), hp)); },

// ===================== Bosses =====================

      turrets: [ { rx: 12, size: 28, hp: 950 * scale, kind: 'aimed', cdBase: 80 },

// ===================== Helpers =====================

// ===================== Update =====================
function update(ts) {

  drones.forEach(d => {

  ctx.fillStyle = '#0f0'; ctx.font = '18px monospace';
  ctx.fillText('Score: ' + s.score + (s.score >= s.best && s.score > 0 ? '  NEW BEST!' : ''), W / 2, 270);
  ctx.fillText('Wave reached: ' + s.wave, W / 2, 300);
  ctx.fillText('Coins earned: ' + s.coins + '  (bank ' + coins + ')', W / 2, 330);
  ctx.fillText('Time: ' + s.time + 's   Best: ' + s.best, W / 2, 360);
  ctx.font = '13px monospace';
  ctx.fillText('Energy ' + energy + '/' + MAX_ENERGY + (energy < MAX_ENERGY ? '  (+1 in ' + energyEta() + ')' : ''), W / 2, 395);
  const r = GO_BTNS.retry, m = GO_BTNS.menu;
  ctx.fillStyle = energy > 0 ? '#030' : '#222'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#0f0'; ctx.font = 'bold 20px monospace'; ctx.fillText(energy > 0 ? 'RETRY (1 Energy)' : 'No Energy', W / 2, r.y + 33);
  ctx.fillStyle = '#030'; ctx.fillRect(m.x, m.y, m.w, m.h); ctx.strokeRect(m.x, m.y, m.w, m.h);
  ctx.fillStyle = '#0f0'; ctx.font = '16px monospace'; ctx.fillText('Menu / Upgrades', W / 2, m.y + 28);
  ctx.textAlign = 'left';
}
function renderIdle() {
  ctx.textAlign = 'center'; ctx.fillStyle = '#0f0';
  ctx.font = 'bold 32px monospace'; ctx.fillText('FORMATION RAPTOR', W / 2, 300);
  ctx.font = '18px monospace';
  ctx.fillText(energy > 0 ? 'Tap here to start a run' : 'No energy, +1 in ' + energyEta(), W / 2, 360);
  ctx.font = '13px monospace';
  ctx.fillText('Energy ' + energy + '/' + MAX_ENERGY + '   Coins ' + coins, W / 2, 395);
  ctx.fillText('Drag anywhere to fly. Auto-fire is always on.', W / 2, 425);
  if (banner && banner.t > 0) { ctx.fillStyle = '#ff0'; ctx.fillText(banner.text, W / 2, 460); banner.t--; }
  ctx.textAlign = 'left';
}

function frame(ts) {
  if (state === 'running' && !picking && !paused) update(ts);
  render();
  requestAnimationFrame(frame);
}

// ===================== Input =====================
document.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === 'p' || e.key === 'Escape') togglePause(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Convert client coords -> canvas coords, accounting for the border and
// object-fit:contain letterboxing (the drawn image is smaller than the element).
function getCanvasTouch(e) {
  const rect = canvas.getBoundingClientRect();
  const boxW = canvas.clientWidth, boxH = canvas.clientHeight;
  const boxL = rect.left + canvas.clientLeft, boxT = rect.top + canvas.clientTop;
  const scale = Math.min(boxW / canvas.width, boxH / canvas.height);
  const offX = (boxW - canvas.width * scale) / 2, offY = (boxH - canvas.height * scale) / 2;
  const t = e.touches ? e.touches[0] : e;
  return { x: (t.clientX - boxL - offX) / scale, y: (t.clientY - boxT - offY) / scale };
}
function inBtn(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
// Returns true if the tap was consumed by an in-canvas screen (game over / idle / pause)
function canvasTap(p) {
  if (state === 'gameover') {
    if (inBtn(p, GO_BTNS.retry)) { state = 'idle'; startRun(); if (!running) state = 'gameover'; }
    else if (inBtn(p, GO_BTNS.menu)) backToMenu();
    return true;
  }
  if (state === 'idle') { startRun(); return true; }
  if (paused && !document.getElementById('upgrades').style.display.includes('block')) { paused = false; return true; }
  return false;
}
function beginDrag(e) {
  const p = getCanvasTouch(e);
  if (canvasTap(p)) return;
  touchX = p.x; touchY = p.y;
  drag = { fx: p.x, fy: p.y, px: player.x, py: player.y };
}
function moveDrag(e) { if (!drag) return; const p = getCanvasTouch(e); touchX = p.x; touchY = p.y; }
function endDrag() { touchX = null; touchY = null; drag = null; }

canvas.addEventListener('touchstart', e => { e.preventDefault(); if (e.touches.length === 1) beginDrag(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) moveDrag(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); if (!e.touches.length) endDrag(); }, { passive: false });
canvas.addEventListener('touchcancel', endDrag, { passive: false });
// Block page scroll / pinch-zoom
document.addEventListener('touchmove', e => { if (e.target === canvas || e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
canvas.addEventListener('mousedown', beginDrag);
canvas.addEventListener('mousemove', e => { if (e.buttons && drag) moveDrag(e); });
window.addEventListener('mouseup', endDrag);
// Auto-pause + save when the app is backgrounded
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'running' && !picking) paused = true; persist(); } });

// ===================== Boot =====================
tickEnergy();
updateUI();
updateHomeScores();
updateDroneUI();
document.getElementById('landing').style.display = 'flex';
document.getElementById('uiPanel').style.display = 'none';
const enterBtn = document.getElementById('enterBtn');
enterBtn.addEventListener('touchend', function(e) { e.preventDefault(); enterGame(); }, { passive: false });
const landingStartBtn = document.getElementById('landingStartBtn');
landingStartBtn.addEventListener('click', startFromLanding);
landingStartBtn.addEventListener('touchend', function(e) { e.preventDefault(); startFromLanding(); }, { passive: false });
document.getElementById('startBtn').addEventListener('touchend', function(e) { e.preventDefault(); startRun(); }, { passive: false });
setInterval(tickEnergy, 1000);
// Test/debug hook (harmless in production)
window.FR = { get state() { return state; }, get boss() { return boss; }, get enemies() { return enemies; }, get enemyBullets() { return enemyBullets; }, get player() { return player; }, get wave() { return wave; } };
requestAnimationFrame(frame);
</script>
</body>
