<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Formation Raptor - Prototype</title>
<style>
body { margin:0; background:#000; color:#0f0; font-family:monospace; overflow:hidden; }
canvas { display:block; position:absolute; top:0; left:0; background:#001122; border:2px solid #0f0; width:100vw; height:100vh; max-width:100vw; max-height:100vh; object-fit:contain; z-index:1; }
#ui { position:absolute; top:4px; left:4px; color:#0f0; font-size:12px; z-index:100; max-width:50vw; }
#uiPanel { display:none; }
button { margin:2px; padding:6px 10px; background:#003300; color:#0f0; border:1px solid #0f0; cursor:pointer; font-size:13px; touch-action:manipulation; position:relative; z-index:101; }
#landing { position:fixed; top:0; left:0; width:100vw; height:100vh; background:#001122; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#droneGraphic { width:120px; height:70px; position:relative; margin-bottom:20px; }
#droneBody { width:70px; height:28px; background:#0af; position:absolute; top:20px; left:25px; border-radius:6px; border:2px solid #0ff; }
#droneWingL { width:30px; height:10px; background:#0ff; position:absolute; top:10px; left:0; border-radius:3px; }
#droneWingR { width:30px; height:10px; background:#0ff; position:absolute; top:10px; right:0; border-radius:3px; }
#droneProp { width:16px; height:16px; background:#ff0; border-radius:50%; position:absolute; top:2px; left:52px; animation:spin 0.4s linear infinite; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
#landing button { font-size:16px; padding:10px 20px; }
#touchHint { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); color:#0f0; font-size:8px; text-align:center; }
#powerup { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:20; text-align:center; }
#powerup button { display:block; width:220px; margin:10px auto; font-size:18px; }
#upgrades { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:25; text-align:center; min-width:260px; }
#upgrades button { display:block; width:220px; margin:8px auto; font-size:16px; }
#scores { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:30; text-align:center; min-width:260px; }
#scores button { display:block; width:220px; margin:10px auto; font-size:16px; }
#drones { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,20,0,0.95); border:2px solid #0f0; padding:20px; z-index:10000; text-align:center; min-width:260px; }
#drones button { display:block; width:220px; margin:8px auto; font-size:16px; }
#scoreList { text-align:left; margin:10px 0; font-size:14px; }
#leaderboard { position:absolute; top:50px; left:4px; color:#0f0; font-size:8px; z-index:100; background:rgba(0,20,0,0.6); border:1px solid #0f0; padding:2px; min-width:80px; max-height:70px; overflow-y:auto; display:none; }
#controls { position:absolute; top:40px; right:4px; background:rgba(0,20,0,0.92); border:1px solid #0f0; padding:2px; z-index:15; font-size:8px; max-height:30vh; overflow-y:auto; width:90px; display:none; }
#controls label { display:block; margin:6px 0 2px; }
#controls input[type=range] { width:100%; }
#controls .val { float:right; color:#0f0; }
</style>
</head>
<body>
<div id="landing">
  <div id="droneGraphic">
    <div id="droneProp"></div>
    <div id="droneWingL"></div>
    <div id="droneWingR"></div>
    <div id="droneBody"></div>
  </div>
  <div style="font-size:18px; margin-bottom:15px;">Formation Raptor</div>
  <button id="enterBtn" onclick="enterGame()" style="font-size:18px; padding:12px 24px;">Enter</button>
  <button id="dronesBtn" onclick="window.toggleDrones=toggleDrones; toggleDrones();">Drones</button>
</div>
<div id="ui">
  <button onclick="toggleUI()">☰ Options</button>
  <div id="uiPanel">
  Energy: <span id="energy">10</span> | Coins: <span id="coins">0</span> | Wave: <span id="wave">1</span>
  <br><button id="startBtn" onclick="startRun()">Start Run (1 Energy)</button>
  <button onclick="upgradeDamage()">Upgrade Damage (+10 coins)</button>
  <br><button onclick="toggleMode()">Mode: <span id="mode">Multi-Group</span></button>
  <button onclick="togglePause()">Pause</button>
  <button onclick="toggleUpgrades()">Upgrades</button>
  <button onclick="document.getElementById('controls').style.display=document.getElementById('controls').style.display==='block'?'none':'block'">Tune</button>
  <button onclick="toggleDrones()">Drones</button>
  </div>
</div>
<div id="leaderboard">
  <div style="font-size:16px; margin-bottom:6px; border-bottom:1px solid #0f0;">Leaderboard</div>
  <div id="homeScores">No scores yet</div>
</div>
<div id="touchHint">Touch & drag anywhere to move</div>
<div id="controls">
  <strong>Live Adjustments</strong><br>
  <label>Damage <span class="val" id="dmgVal">36</span></label>
  <input type="range" id="dmgSlider" min="10" max="100" value="36" oninput="setDamage(this.value)">
  <label>Fire Rate (ms) <span class="val" id="frVal">110</span></label>
  <input type="range" id="frSlider" min="50" max="300" value="110" oninput="setFireRate(this.value)">
  <label>Player Speed <span class="val" id="spdVal">5</span></label>
  <input type="range" id="spdSlider" min="2" max="12" value="5" oninput="setSpeed(this.value)">
  <label>Player HP <span class="val" id="hpVal">100</span></label>
  <input type="range" id="hpSlider" min="50" max="300" value="100" oninput="setHP(this.value)">
  <label>Enemy HP Scale <span class="val" id="ehpVal">1</span></label>
  <input type="range" id="ehpSlider" min="0.5" max="3" step="0.1" value="1" oninput="setEnemyHP(this.value)">
  <label>Contact Dmg Scale <span class="val" id="cdmgVal">1</span></label>
  <input type="range" id="cdmgSlider" min="0.5" max="3" step="0.1" value="1" oninput="setContactDmg(this.value)">
  <label>Enemy Proj Scale <span class="val" id="epdmgVal">1</span></label>
  <input type="range" id="epdmgSlider" min="0.5" max="3" step="0.1" value="1" oninput="setEnemyProj(this.value)">
  <button onclick="document.getElementById('controls').style.display='none'">Hide</button>
</div>
<div id="powerup">
  <div style="font-size:20px; margin-bottom:10px;">Wave Clear! Pick a Power-Up</div>
  <button id="p1" onclick="pickPower(0)"></button>
  <button id="p2" onclick="pickPower(1)"></button>
  <button id="p3" onclick="pickPower(2)"></button>
</div>
<div id="upgrades">
  <div style="font-size:20px; margin-bottom:10px;">Permanent Upgrades</div>
  <div>Coins: <span id="upgCoins">0</span></div>
  <button id="btnDmg" onclick="buyDamage()">+5 Damage (100 coins)</button>
  <button id="btnFR" onclick="buyFireRate()">+Fire Rate (100 coins)</button>
  <button id="btnSpd" onclick="buySpeed()">+1 Speed (100 coins)</button>
  <button id="btnHP" onclick="buyMaxHP()">+20 Max HP (100 coins)</button>
  <button onclick="toggleUpgrades()">Close</button>
</div>
<div id="scores">
  <div style="font-size:20px; margin-bottom:10px;">Top Scores</div>
  <div id="scoreList"></div>
  <button onclick="document.getElementById('scores').style.display='none'">Close</button>
</div>
<div id="drones">
  <div style="font-size:20px; margin-bottom:10px;">Drone Bay</div>
  <div id="dronePreview" style="width:60px; height:40px; margin:10px auto; border:1px solid #0f0;"></div>
  <div>Level: <span id="droneLevel">1</span> | Color: <span id="droneColorName">Basic</span></div>
  <button onclick="upgradeDrone()">Upgrade Drone (100 coins)</button>
  <div style="margin-top:10px; font-size:12px;">Upgrades change drone color and boost damage.</div>
  <button onclick="toggleDrones()">Close</button>
</div>
<canvas id="game" width="480" height="720"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let energy = 10, coins = 0, wave = 1, damage = 36, running = false;
let player = { x: 240, y: 600, w: 30, h: 30, speed: 5, hp: 100, maxHp: 100 };
let bullets = [], enemies = [], boss = null, keys = {};
let enemyBullets = [];
let lastShot = 0;
let touchX = null;
let touchY = null;
let mode = 'multi';
let drones = [];
let fireRate = 100;
let multiShot = 1;
let picking = false;
let paused = false;
let currentOptions = [];
let invuln = 0;
let shieldBubbles = [];
let healthBubbles = [];
let hasShield = false;
let shieldTimer = 0;
let enemyHPScale = 1;
let contactDmgScale = 1;
let enemyProjScale = 1;
let dmgBuys = 0, frBuys = 0, spdBuys = 0, hpBuys = 0;
let runScore = 0;
let highScores = JSON.parse(localStorage.getItem('fr_scores') || '[]');
let droneLevel = parseInt(localStorage.getItem('fr_droneLevel') || '1');
const droneColors = ['#0af', '#0ff', '#ff0', '#f80', '#f0f', '#fff'];
const droneNames = ['Basic', 'Enhanced', 'Advanced', 'Elite', 'Master', 'Legend'];

function setDamage(v) { damage = parseInt(v); document.getElementById('dmgVal').textContent = v; }
function setFireRate(v) { fireRate = parseInt(v); document.getElementById('frVal').textContent = v; }
function setSpeed(v) { player.speed = parseInt(v); document.getElementById('spdVal').textContent = v; }
function setHP(v) { player.maxHp = parseInt(v); player.hp = Math.min(player.hp, player.maxHp); document.getElementById('hpVal').textContent = v; }
function setEnemyHP(v) { enemyHPScale = parseFloat(v); document.getElementById('ehpVal').textContent = v; }
function setContactDmg(v) { contactDmgScale = parseFloat(v); document.getElementById('cdmgVal').textContent = v; }
function setEnemyProj(v) { enemyProjScale = parseFloat(v); document.getElementById('epdmgVal').textContent = v; }

const powerups = [
  { name: "+Damage", apply: () => { damage += 15; } },
  { name: "+Fire Rate", apply: () => { fireRate = Math.max(50, fireRate - 20); } },
  { name: "Split Shot", apply: () => { multiShot = Math.max(multiShot, 2); } },
  { name: "Dual Fire", apply: () => { multiShot += 1; } },
  { name: "+1 Projectile", apply: () => { multiShot++; } },
  { name: "Drone Boost", apply: () => { drones.push({ offsetX: 0, offsetY: -40, lastShot: 0 }); } },
  { name: "+Speed", apply: () => { player.speed += 1; } }
];

function toggleDrones() {
  const el = document.getElementById('drones');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  if (!open) {
    updateDroneUI();
    // Keep landing visible but raise modal above it
  }
}

function updateDroneUI() {
  const color = droneColors[Math.min(droneLevel - 1, droneColors.length - 1)];
  const name = droneNames[Math.min(droneLevel - 1, droneNames.length - 1)];
  document.getElementById('droneLevel').textContent = droneLevel;
  document.getElementById('droneColorName').textContent = name;
  document.getElementById('dronePreview').style.background = color;
  const cost = 100 + (droneLevel - 1) * 50;
  document.querySelector('#drones button').textContent = 'Upgrade Drone (' + cost + ' coins)';
}

function upgradeDrone() {
  const cost = 100 + (droneLevel - 1) * 50;
  if (coins >= cost && droneLevel < droneColors.length) {
    coins -= cost;
    droneLevel++;
    localStorage.setItem('fr_droneLevel', droneLevel);
    updateUI();
    updateDroneUI();
  }
}

function enterGame() {
  const landing = document.getElementById('landing');
  if (landing) {
    landing.style.display = 'none';
    landing.style.visibility = 'hidden';
  }
  const panel = document.getElementById('uiPanel');
  if (panel) panel.style.display = 'block';
  const lb = document.getElementById('leaderboard');
  if (lb) lb.style.display = 'block';
  // Bring UI above canvas
  document.getElementById('ui').style.zIndex = '1000';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('landing').style.display !== 'none') {
    enterGame();
  }
});

function toggleUI() {
  const panel = document.getElementById('uiPanel');
  const lb = document.getElementById('leaderboard');
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  if (lb) lb.style.display = open ? 'none' : 'block';
}

function updateUI() {
  document.getElementById('energy').textContent = energy;
  document.getElementById('coins').textContent = coins;
  document.getElementById('wave').textContent = wave;
  document.getElementById('mode').textContent = mode === 'multi' ? 'Multi-Group' : 'Single Durable';
}

function drawHealthBar() {
  const barW = 120, barH = 10;
  const x = 10, y = canvas.height - 30;
  ctx.fillStyle = '#300';
  ctx.fillRect(x, y, barW, barH);
  ctx.fillStyle = '#0f0';
  ctx.fillRect(x, y, barW * (player.hp / player.maxHp), barH);
  ctx.strokeStyle = '#0f0';
  ctx.strokeRect(x, y, barW, barH);
  ctx.fillStyle = '#0f0';
  ctx.font = '12px monospace';
  ctx.fillText('HP: ' + Math.ceil(player.hp), x, y - 4);
}

function toggleMode() {
  mode = mode === 'multi' ? 'single' : 'multi';
  updateUI();
}

function updateHomeScores() {
  const el = document.getElementById('homeScores');
  if (!el) return;
  el.innerHTML = highScores.length ? highScores.map((s,i) => 
    (i+1) + '. Wave ' + s.wave + ' — ' + s.score
  ).join('<br>') : 'No scores yet';
}

function showScores() {
  const el = document.getElementById('scores');
  const list = document.getElementById('scoreList');
  list.innerHTML = highScores.length ? highScores.map((s,i) => 
    (i+1) + '. Wave ' + s.wave + ' — ' + s.score + ' pts'
  ).join('<br>') : 'No scores yet';
  el.style.display = 'block';
}

function saveScore() {
  const entry = { wave: wave, score: runScore, date: new Date().toLocaleDateString() };
  highScores.push(entry);
  highScores.sort((a,b) => b.score - a.score);
  highScores = highScores.slice(0, 10);
  localStorage.setItem('fr_scores', JSON.stringify(highScores));
  updateHomeScores();
}

function startRun() {
  if (energy <= 0 || running) return;
  energy--;
  running = true;
  picking = false;
  paused = false;
  enemies = [];
  bullets = [];
  enemyBullets = [];
  shieldBubbles = [];
  healthBubbles = [];
  hasShield = false;
  wave = 1;
  runScore = 0;
  damage = 36;
  fireRate = 110;
  multiShot = 1;
  player.speed = 5;
  player.hp = player.maxHp;
  drones = [
    { offsetX: -40, offsetY: -20, lastShot: 0 },
    { offsetX: 40, offsetY: -20, lastShot: 0 }
  ];
  document.getElementById('powerup').style.display = 'none';
  spawnWave();
  updateUI();
}

function toggleUpgrades() {
  const el = document.getElementById('upgrades');
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  document.getElementById('upgCoins').textContent = coins;
  updateUpgradeButtons();
  if (!open && running) paused = true;
  if (open) paused = false;
}

function updateUpgradeButtons() {
  document.getElementById('btnDmg').textContent = '+5 Damage (' + (100 + dmgBuys * 50) + ' coins)';
  document.getElementById('btnFR').textContent = '+Fire Rate (' + (100 + frBuys * 60) + ' coins)';
  document.getElementById('btnSpd').textContent = '+1 Speed (' + (100 + spdBuys * 50) + ' coins)';
  document.getElementById('btnHP').textContent = '+20 Max HP (' + (100 + hpBuys * 70) + ' coins)';
}

function buyDamage() {
  const cost = 100 + dmgBuys * 50;
  if (coins >= cost) { coins -= cost; damage += 5; dmgBuys++; updateUI(); document.getElementById('upgCoins').textContent = coins; updateUpgradeButtons(); }
}
function buyFireRate() {
  const cost = 100 + frBuys * 60;
  if (coins >= cost) { coins -= cost; fireRate = Math.max(50, fireRate - 15); frBuys++; updateUI(); document.getElementById('upgCoins').textContent = coins; updateUpgradeButtons(); }
}
function buySpeed() {
  const cost = 100 + spdBuys * 50;
  if (coins >= cost) { coins -= cost; player.speed += 1; spdBuys++; updateUI(); document.getElementById('upgCoins').textContent = coins; updateUpgradeButtons(); }
}
function buyMaxHP() {
  const cost = 100 + hpBuys * 70;
  if (coins >= cost) { coins -= cost; player.maxHp += 20; player.hp += 20; hpBuys++; updateUI(); document.getElementById('upgCoins').textContent = coins; updateUpgradeButtons(); }
}

function showPowerups() {
  picking = true;
  currentOptions = [];
  const pool = [...powerups];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    currentOptions.push(pool.splice(idx, 1)[0]);
  }
  document.getElementById('p1').textContent = currentOptions[0].name;
  document.getElementById('p2').textContent = currentOptions[1].name;
  document.getElementById('p3').textContent = currentOptions[2].name;
  document.getElementById('powerup').style.display = 'block';
}

function pickPower(i) {
  if (!picking) return;
  currentOptions[i].apply();
  picking = false;
  document.getElementById('powerup').style.display = 'none';
  wave++;
  spawnWave();
  updateUI();
}

function spawnWave() {
  enemies = [];
  const countScale = 28 + Math.floor(wave * 6);
  const hpBase = (16 + wave * 5) * enemyHPScale;

  if (mode === 'single') {
    enemies.push({
      x: 210, y: -120,
      w: 90, h: 90,
      vx: 0.15, vy: 0.4,
      hp: 800 + wave * 150,
      diving: false,
      type: 'tank'
    });
    return;
  }

  const patterns = [
    () => { // single column of normals
      for (let i = 0; i < Math.floor(countScale * 1.0); i++) {
        enemies.push({ x: 220, y: -50 - i * 22, w: 22, h: 22, vx: 0, vy: 0.7, hp: hpBase, diving: false, type: 'normal' });
      }
    },
    () => { // sides with some chargers
      for (let i = 0; i < Math.floor(countScale * 0.8); i++) {
        const type = i % 4 === 0 ? 'charger' : 'normal';
        enemies.push({ x: 60, y: -60 - i * 20, w: 22, h: 22, vx: 0, vy: 0.65, hp: hpBase, diving: false, type });
        enemies.push({ x: 380, y: -60 - i * 20, w: 22, h: 22, vx: 0, vy: 0.65, hp: hpBase, diving: false, type });
      }
    },
    () => { // V with shooters
      for (let i = 0; i < Math.floor(countScale * 0.7); i++) {
        const type = i % 3 === 0 ? 'shooter' : 'normal';
        enemies.push({ x: 240 - i * 14, y: -50 - i * 18, w: 22, h: 22, vx: 0, vy: 0.7, hp: hpBase, diving: false, type });
        enemies.push({ x: 240 + i * 14, y: -50 - i * 18, w: 22, h: 22, vx: 0, vy: 0.7, hp: hpBase, diving: false, type });
      }
    },
    () => { // staggered tanks + normals
      for (let g = 0; g < 4; g++) {
        for (let i = 0; i < Math.ceil(countScale / 2.5); i++) {
          const type = (g === 1 || g === 2) && i % 5 === 0 ? 'tank' : 'normal';
          enemies.push({
            x: 40 + g * 110,
            y: -70 - i * 24 - g * 10,
            w: type === 'tank' ? 32 : 22,
            h: type === 'tank' ? 32 : 22,
            vx: 0, vy: 0.6, hp: type === 'tank' ? hpBase * 2.5 : hpBase, diving: false, type
          });
        }
      }
    }
  ];

  const numPatterns = 3 + Math.floor(wave / 2);
  for (let p = 0; p < numPatterns; p++) {
    const fn = patterns[Math.floor(Math.random() * patterns.length)];
    fn();
  }

  // Random mixed adds
  const extras = 6 + Math.floor(wave * 2);
  for (let i = 0; i < extras; i++) {
    const types = ['normal', 'charger', 'shooter', 'tank'];
    const type = types[Math.floor(Math.random() * types.length)];
    enemies.push({
      x: 30 + Math.random() * 420,
      y: -100 - Math.random() * 300,
      w: type === 'tank' ? 30 : 20,
      h: type === 'tank' ? 30 : 20,
      vx: (Math.random() - 0.5) * 0.4,
      vy: 0.5 + Math.random() * 0.3,
      hp: type === 'tank' ? hpBase * 2 : hpBase - 5,
      diving: false,
      type
    });
  }

  // Boss waves: mini bosses on odd 10s (10, 30, 50...), big bosses on 20, 40, 60...
  const isMiniBoss = wave % 20 === 10;
  const isBigBoss = wave % 20 === 0 && wave > 0;
  if (isMiniBoss || isBigBoss) {
    // Clear center so the boss is visible
    enemies = enemies.filter(e => Math.abs(e.x - 240) > 140 || e.y < -200);
    spawnBoss(isBigBoss);
  }

  // Health bubble every 2 waves
  if (wave % 2 === 0 && wave > 0) {
    healthBubbles.push({
      x: 100 + Math.random() * 280,
      y: -50,
      w: 28, h: 28,
      vy: 1.4,
      heal: 25 + wave * 2
    });
  }
}

function spawnBoss(isBig) {
  if (isBig) {
    // Big boss: waves 20, 40, 60... much tankier
    boss = {
      x: 80, y: 40,
      w: 320, h: 160,
      hp: 2500 + wave * 120,
      isBig: true,
      attack: 18 + Math.floor(wave * 0.8),
      lastShot: 0,
      turrets: [
        { x: 20, y: 50, hp: 200, active: true },
        { x: 280, y: 50, hp: 200, active: true },
        { x: 150, y: 30, hp: 250, active: true },
        { x: 80, y: 70, hp: 150, active: true },
        { x: 220, y: 70, hp: 150, active: true }
      ]
    };
  } else {
    // Mini boss: waves 10, 30, 50... tankier
    boss = {
      x: 160, y: 70,
      w: 160, h: 90,
      hp: 900 + wave * 60,
      isBig: false,
      attack: 10 + Math.floor(wave * 0.4),
      lastShot: 0,
      turrets: [
        { x: 15, y: 30, hp: 100, active: true },
        { x: 125, y: 30, hp: 100, active: true },
        { x: 70, y: 50, hp: 80, active: true }
      ]
    };
  }
}

function gameLoop(ts) {
  if (!running || picking || paused) { requestAnimationFrame(gameLoop); return; }
  ctx.fillStyle = '#001122';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Prefer keyboard when keys are held; otherwise use mouse/touch drag
  const usingKeys = keys['ArrowLeft'] || keys['a'] || keys['ArrowRight'] || keys['d'] || keys['ArrowUp'] || keys['w'] || keys['ArrowDown'] || keys['s'];
  if (usingKeys) {
    if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
    if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
    touchX = null; touchY = null;
  } else if (touchX !== null && touchY !== null) {
    player.x = touchX - player.w / 2;
    player.y = touchY - player.h / 2;
  }
  // Rectangle perimeter the player cannot move past (larger for phone)
  const rectX = 30, rectY = canvas.height * 0.32, rectW = 420, rectH = 380;
  player.x = Math.max(rectX, Math.min(rectX + rectW - player.w, player.x));
  player.y = Math.max(rectY, Math.min(rectY + rectH - player.h, player.y));

  // Draw the movement rectangle perimeter
  ctx.strokeStyle = '#0a0';
  ctx.lineWidth = 2;
  ctx.strokeRect(rectX, rectY, rectW, rectH);

  drones.forEach(d => {
    const dx = player.x + d.offsetX;
    const dy = player.y + d.offsetY;
    ctx.fillStyle = droneColors[Math.min(droneLevel - 1, droneColors.length - 1)];
    ctx.fillRect(dx, dy, 14, 14);
    if (ts - d.lastShot > 180) {
      const waveDamage = Math.floor(damage * (1 + (wave - 1) * 0.08) * (1 + (droneLevel - 1) * 0.15));
      bullets.push({ x: dx + 4, y: dy, vy: -7, dmg: Math.floor(waveDamage * 0.6) });
      d.lastShot = ts;
    }
  });

  if (ts - lastShot > fireRate) {
    const waveDamage = Math.floor(damage * (1 + (wave - 1) * 0.08));
    for (let i = 0; i < multiShot; i++) {
      const offset = (i - (multiShot-1)/2) * 12;
      bullets.push({ x: player.x + 12 + offset, y: player.y, vy: -8, dmg: waveDamage });
    }
    lastShot = ts;
  }

  bullets = bullets.filter(b => {
    b.y += b.vy;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(b.x, b.y, 6, 12);
    return b.y > 0;
  });

  // Enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx;
    b.y += b.vy;
    ctx.fillStyle = b.type === 'tank' ? '#f40' : '#0ff';
    ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
    // Hit player
    if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h && invuln <= 0 && running) {
      if (hasShield) {
        hasShield = false;
        shieldTimer = 0;
        return false;
      }
      const dist = Math.sqrt(Math.pow(b.x - (player.x + player.w/2), 2) + Math.pow(b.y - (player.y + player.h/2), 2));
      const falloff = Math.max(0.4, 1 - dist / 200);
      player.hp -= Math.ceil(b.dmg * falloff);
      invuln = 20;
      energy = Math.max(0, energy - 1);
      if (player.hp <= 0) {
        player.hp = 0;
        running = false;
        alert('Run ended! Wave ' + wave + ' — Score: ' + runScore);
        saveScore();
      }
      updateUI();
      return false;
    }
    return b.y > 0 && b.y < canvas.height && b.x > 0 && b.x < canvas.width;
  });

  // Health bubbles
  healthBubbles = healthBubbles.filter(b => {
    b.y += b.vy;
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,0,0.4)';
    ctx.fill();
    // Collect by shooting or touching
    let collected = false;
    bullets.forEach(bullet => {
      if (bullet.x > b.x && bullet.x < b.x + b.w && bullet.y > b.y && bullet.y < b.y + b.h) {
        collected = true;
        bullet.y = -999;
      }
    });
    const dx = (b.x + b.w/2) - (player.x + player.w/2);
    const dy = (b.y + b.h/2) - (player.y + player.h/2);
    if (Math.sqrt(dx*dx + dy*dy) < 40) collected = true;
    if (collected) {
      player.hp = Math.min(player.maxHp, player.hp + b.heal);
      updateUI();
      return false;
    }
    return b.y < canvas.height;
  });

  // Shield bubbles
  shieldBubbles = shieldBubbles.filter(b => {
    b.y += b.vy;
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,255,0.3)';
    ctx.fill();
    // Pop with player bullets
    bullets.forEach(bullet => {
      if (bullet.x > b.x && bullet.x < b.x + b.w && bullet.y > b.y && bullet.y < b.y + b.h) {
        b.hp -= bullet.dmg;
        bullet.y = -999;
        if (b.hp <= 0) {
          hasShield = true;
          shieldTimer = 300;
          b.y = 9999;
        }
      }
    });
    return b.y < canvas.height && b.hp > 0;
  });

  // Shield timer
  if (hasShield && shieldTimer > 0) {
    shieldTimer--;
    if (shieldTimer <= 0) hasShield = false;
  }

  enemies.forEach(e => {
    // Varied movement patterns
    if (!e.diving && e.y > 100) {
      e.diving = true;
      if (e.type === 'charger') {
        e.vy = 2.4;
        e.vx = (player.x - e.x) * 0.02;
      } else if (e.type === 'shooter') {
        e.vy = 0.8;
        e.vx = Math.sin(Date.now() / 300 + e.x) * 1.0;
      } else if (e.type === 'tank') {
        e.vy = 0.6;
        e.vx = (player.x - e.x) * 0.005;
      } else {
        // normal: slight weave or straight
        e.vy = 1.2;
        e.vx = Math.sin(Date.now() / 400 + e.y) * 0.5;
      }
    }
    e.x += e.vx; e.y += e.vy;
    // Shooting for shooters and tanks
    if ((e.type === 'shooter' || e.type === 'tank') && Math.random() < (e.type === 'tank' ? 0.005 : 0.01) && e.y > 50 && e.y < 500) {
      const dx = (player.x + player.w/2) - (e.x + e.w/2);
      const dy = (player.y + player.h/2) - (e.y + e.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      enemyBullets.push({
        x: e.x + e.w/2,
        y: e.y + e.h/2,
        vx: (dx / dist) * (e.type === 'tank' ? 3 : 4),
        vy: (dy / dist) * (e.type === 'tank' ? 3 : 4),
        dmg: (e.type === 'tank' ? 8 + Math.floor(wave * 0.6) : 4 + Math.floor(wave * 0.4)) * enemyProjScale,
        type: e.type
      });
    }
    // Color by type
    if (e.type === 'tank') ctx.fillStyle = '#a00';
    else if (e.type === 'charger') ctx.fillStyle = '#f80';
    else if (e.type === 'shooter') ctx.fillStyle = '#0af';
    else ctx.fillStyle = e.diving ? '#f00' : '#ff0';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    // Collision + coin drop
    bullets.forEach(b => {
      if (b.x > e.x && b.x < e.x+e.w && b.y > e.y && b.y < e.y+e.h) {
        e.hp -= b.dmg;
        b.y = -999;
        if (e.hp <= 0) {
          let drop = 1;
          if (e.type === 'tank') drop = 5;
          else if (e.type === 'charger') drop = 3;
          else if (e.type === 'shooter') drop = 2;
          coins += drop;
          runScore += drop * 10;
          if (e.type === 'tank') energy = Math.min(20, energy + 1);
          // Chance to drop health bubble — starts ~1% at wave 1, decreases slowly
          let baseChance = Math.max(0.004, 0.012 - wave * 0.0008);
          let chance = baseChance;
          if (e.type === 'tank') chance = baseChance * 3;
          else if (e.type === 'charger') chance = baseChance * 2;
          else if (e.type === 'shooter') chance = baseChance * 1.5;
          if (Math.random() < chance) {
            healthBubbles.push({
              x: e.x,
              y: e.y,
              w: 24, h: 24,
              vy: 0.8,
              heal: 15 + Math.floor(wave * 1.5)
            });
          }
          updateUI();
        }
      }
    });
  });
  enemies = enemies.filter(e => e.hp > 0 && e.y < canvas.height);

  if (boss) {
    ctx.fillStyle = boss.isBig ? '#844' : '#666';
    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
    // HP bar on boss
    ctx.fillStyle = '#300';
    ctx.fillRect(boss.x, boss.y - 8, boss.w, 6);
    ctx.fillStyle = boss.isBig ? '#f40' : '#0f0';
    const maxHp = boss.isBig ? (2500 + wave * 120) : (900 + wave * 60);
    ctx.fillRect(boss.x, boss.y - 8, boss.w * (boss.hp / maxHp), 6);
    boss.turrets.forEach((t) => {
      if (t.active) {
        ctx.fillStyle = '#f80';
        ctx.fillRect(boss.x + t.x, boss.y + t.y, boss.isBig ? 28 : 20, boss.isBig ? 28 : 20);
      }
    });
    // Boss attack
    if (ts - boss.lastShot > (boss.isBig ? 800 : 1200)) {
      enemyBullets.push({
        x: boss.x + boss.w / 2,
        y: boss.y + boss.h,
        vx: (player.x - boss.x) * 0.01,
        vy: 4,
        dmg: boss.attack,
        type: 'boss'
      });
      boss.lastShot = ts;
    }
    bullets.forEach(b => {
      if (b.x > boss.x && b.x < boss.x+boss.w && b.y > boss.y && b.y < boss.y+boss.h) {
        boss.hp -= b.dmg; b.y = -999;
        boss.turrets.forEach(t => {
          const tw = boss.isBig ? 28 : 20;
          if (t.active && b.x > boss.x+t.x && b.x < boss.x+t.x+tw) t.hp -= b.dmg;
        });
      }
    });
    boss.turrets.forEach(t => { if (t.hp <= 0) t.active = false; });
    if (boss.hp <= 0) { 
      coins += boss.isBig ? 100 : 40; 
      runScore += boss.isBig ? 1000 : 400; 
      energy = Math.min(20, energy + (boss.isBig ? 3 : 1)); 
      boss = null; 
      showPowerups(); 
    }
  }

  if (enemies.length === 0 && !boss && running && !picking) {
    const isBossWave = (wave % 20 === 0 && wave > 0) || wave % 20 === 10;
    if (isBossWave && !boss) {
      // Boss wave but boss missing — spawn it
      spawnBoss(wave % 20 === 0);
    } else if (!isBossWave) {
      showPowerups();
    }
  }

  // Contact damage from close enemies
  if (invuln > 0) invuln--;
  enemies.forEach(e => {
    const dx = (e.x + e.w/2) - (player.x + player.w/2);
    const dy = (e.y + e.h/2) - (player.y + player.h/2);
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 40 && invuln <= 0 && running) {
      if (hasShield) {
        hasShield = false;
        shieldTimer = 0;
      } else {
        let dmg = (3 + Math.floor(wave * 0.6)) * contactDmgScale;
        if (e.type === 'tank') dmg = (8 + wave) * contactDmgScale;
        else if (e.type === 'charger') dmg = (6 + Math.floor(wave * 0.7)) * contactDmgScale;
        else if (e.type === 'shooter') dmg = (5 + Math.floor(wave * 0.5)) * contactDmgScale;
        player.hp -= dmg;
        invuln = 30;
        energy = Math.max(0, energy - 1);
        if (player.hp <= 0) {
          player.hp = 0;
          running = false;
          saveScore();
          alert('Run ended! Wave ' + wave + ' — Score: ' + runScore);
        }
      }
      updateUI();
    }
  });

  drawHealthBar();

  // Draw player + cross reticle (center is the movable dot)
  ctx.fillStyle = hasShield ? '#0ff' : (invuln > 0 ? '#0a0' : '#0f0');
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1;
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;
  ctx.beginPath();
  ctx.moveTo(cx - 18, cy); ctx.lineTo(cx + 18, cy);
  ctx.moveTo(cx, cy - 18); ctx.lineTo(cx, cy + 18);
  ctx.stroke();
  if (hasShield) {
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
    ctx.stroke();
  }

  requestAnimationFrame(gameLoop);
}
document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup', e => { keys[e.key] = false; });

function getCanvasTouch(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const t = e.touches ? e.touches[0] : e;
  const clientX = t.clientX;
  const clientY = t.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

// Better touch support for mobile (Pixel)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length) {
    const p = getCanvasTouch(e);
    touchX = p.x; touchY = p.y;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length) {
    const p = getCanvasTouch(e);
    touchX = p.x; touchY = p.y;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!e.touches.length) {
    touchX = null; touchY = null;
  }
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
  touchX = null; touchY = null;
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  const p = getCanvasTouch(e);
  touchX = p.x; touchY = p.y;
});
canvas.addEventListener('mousemove', e => {
  if (e.buttons) {
    const p = getCanvasTouch(e);
    touchX = p.x; touchY = p.y;
  }
});
canvas.addEventListener('mouseup', () => { touchX = null; touchY = null; });

updateUI();
updateHomeScores();
updateDroneUI();
// Force landing visible on load
document.getElementById('landing').style.display = 'flex';
document.getElementById('uiPanel').style.display = 'none';

// Reliable Enter button handler
const enterBtn = document.getElementById('enterBtn');
if (enterBtn) {
  enterBtn.addEventListener('click', enterGame);
  enterBtn.addEventListener('touchend', function(e) { e.preventDefault(); enterGame(); }, { passive: false });
}

requestAnimationFrame(gameLoop);

// Extra touch support for Start button on mobile
document.getElementById('startBtn').addEventListener('touchend', function(e) {
  e.preventDefault();
  startRun();
}, { passive: false });
</script>
</body>
